apiVersion: apps/v1
kind: Deployment
metadata:
  name: scale0
  namespace: scale0
  labels:
    app: scale0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scale0
  template:
    metadata:
      labels:
        app: scale0
    spec:
      serviceAccountName: scale0
      containers:
        - name: scale0
          image: scale0:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: CHECK_INTERVAL_MS
              value: "30000"
            - name: WAKEUP_PORT
              value: "8080"
            - name: SCALE_IN_AFTER_SECONDS
              value: "86400"
            - name: RETRY_AFTER_SECONDS
              value: "5"
            - name: LABEL_PREFIX
              value: "scale0.io"
            - name: SCALE0_SERVICE_NAME
              value: "scale0"
            - name: SCALE0_SERVICE_NAMESPACE
              value: "scale0"
            - name: TARPIT_DELAY_SECONDS
              value: "3"
            - name: TARPIT_SECRET
              valueFrom:
                secretKeyRef:
                  name: scale0
                  key: tarpit-secret
                  optional: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: scale0
  namespace: scale0
  labels:
    app: scale0
spec:
  selector:
    app: scale0
  ports:
    - port: 8080
      targetPort: http
      name: http
