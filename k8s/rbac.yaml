apiVersion: v1
kind: Namespace
metadata:
  name: scale0
  labels:
    app: scale0
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scale0
  namespace: scale0
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: scale0
rules:
  # Watch services across all namespaces
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  # Manage HPAs
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "update", "patch"]
  # Manage VirtualServices (Istio)
  - apiGroups: ["networking.istio.io"]
    resources: ["virtualservices"]
    verbs: ["get", "list", "watch", "update", "patch"]
  # Read workloads (to check ready replicas) - all types HPA can target
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["replicationcontrollers"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: scale0
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: scale0
subjects:
  - kind: ServiceAccount
    name: scale0
    namespace: scale0
