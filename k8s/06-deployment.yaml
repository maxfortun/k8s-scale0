apiVersion: apps/v1
kind: Deployment
metadata:
  name: scale0
  namespace: scale0
  labels:
    app: scale0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scale0
  template:
    metadata:
      labels:
        app: scale0
    spec:
      serviceAccountName: scale0
      containers:
        - name: scale0
          image: scale0:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: scale0
          env:
            - name: TARPIT_SECRET
              valueFrom:
                secretKeyRef:
                  name: scale0
                  key: tarpit-secret
                  optional: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
