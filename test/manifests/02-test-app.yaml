apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-app
  namespace: scale0-test
  labels:
    app: test-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: test-app
  template:
    metadata:
      labels:
        app: test-app
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: test-app
  namespace: scale0-test
  labels:
    scale0/enabled: "true"
    scale0/scale-in-after: "60"
spec:
  selector:
    app: test-app
  ports:
    - port: 80
      targetPort: 80
      name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: test-app
  namespace: scale0-test
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: test-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: test-app-vs
  namespace: scale0-test
spec:
  hosts:
    - test-app.example.com
  gateways:
    - test-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: test-app
            port:
              number: 80
