apiVersion: v1
kind: Service
metadata:
  name: stateful-app
  namespace: stateful-app
  labels:
    app: stateful-app
    # scale0 opt-in labels
    scale0.io/enabled: "true"
    scale0.io/scale-in-after: "7200"  # scale down after 2 hours
spec:
  selector:
    app: stateful-app
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
