apiVersion: v1
kind: Service
metadata:
  name: my-app
  namespace: my-app
  labels:
    app: my-app
    # scale0 opt-in labels
    scale0/enabled: "true"
    scale0/scale-in-after: "3600"  # scale down after 1 hour of inactivity
spec:
  selector:
    app: my-app
  ports:
    - port: 80
      targetPort: 80
      name: http
