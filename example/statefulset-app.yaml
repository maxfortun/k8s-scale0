apiVersion: v1
kind: Namespace
metadata:
  name: stateful-app
  labels:
    istio-injection: enabled
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stateful-app
  namespace: stateful-app
  labels:
    app: stateful-app
spec:
  serviceName: stateful-app
  replicas: 1
  selector:
    matchLabels:
      app: stateful-app
  template:
    metadata:
      labels:
        app: stateful-app
    spec:
      containers:
        - name: stateful-app
          image: redis:alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: stateful-app
  namespace: stateful-app
  labels:
    app: stateful-app
    # scale0 opt-in labels
    scale0.io/enabled: "true"
    scale0.io/scale-in-after: "7200"  # scale down after 2 hours
spec:
  selector:
    app: stateful-app
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stateful-app
  namespace: stateful-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: stateful-app
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: stateful-app
  namespace: stateful-app
spec:
  hosts:
    - stateful-app.example.com
  gateways:
    - istio-system/default-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: stateful-app
            port:
              number: 6379
          weight: 100
